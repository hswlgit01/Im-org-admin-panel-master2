# ============================================
# Im-org-admin-panel CI/CD 流水线配置
# ============================================

name: Build & Deploy Admin Panel

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install
             pnpm add xlsx

      - name: Build project
        run: pnpm run build

      - name: Build Docker image
        run: docker build -t free-im-admin:latest .

      - name: Save image to file
        run: docker save free-im-admin:latest | gzip > free-im-admin.tar.gz

      - name: Copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "free-im-admin.tar.gz"
          target: "/root/deploy/"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker load < /root/deploy/free-im-admin.tar.gz
            rm -f /root/deploy/free-im-admin.tar.gz
            docker stop free-im-admin 2>/dev/null || true
            docker rm free-im-admin 2>/dev/null || true
            docker run -d --name free-im-admin --restart unless-stopped -p 11002:80 free-im-admin:latest
            docker ps | grep free-im-admin