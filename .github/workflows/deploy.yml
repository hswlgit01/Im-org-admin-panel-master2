# ============================================
# Im-org-admin-panel CI/CD
# ============================================

name: Build & Deploy Admin Panel

on:
  push:
    branches: [master, main, dev]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t freechat-admin:latest .

      - name: Save image to file
        run: docker save freechat-admin:latest | gzip > freechat-admin.tar.gz

      - name: Copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "freechat-admin.tar.gz"
          target: "/root/deploy/"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            docker stop freechat-admin 2>/dev/null || true
            docker rm   freechat-admin 2>/dev/null || true
            docker rmi  freechat-admin:latest 2>/dev/null || true
            docker load < /root/deploy/freechat-admin.tar.gz
            rm -f /root/deploy/freechat-admin.tar.gz
            # --network host so nginx 能直达宿主机 127.0.0.1:10008/10009/10002。
            # chat-api-admin (10009) 配置是 listenIP: localhost，仅在宿主 127.0.0.1
            # 上监听；bridge 网络容器够不着，host 模式可以。nginx 自己也改成直接
            # listen 11002（不再用 -p 11002:80 做端口映射）。
            docker run -d --name freechat-admin \
              --network host --restart unless-stopped \
              freechat-admin:latest
            sleep 2
            docker ps --filter name=freechat-admin
