version: '1.0'
name: deploy-freechat-admin
displayName: 部署 FreeChat Admin

# dawn 2026-06-22 迁移 Gitee Go：后台管理端改为 Gitee 主机组本地构建并替换容器。
triggers:
  push:
    branches:
      include:
        - main

stages:
  - stage:
      name: build_and_deploy
      displayName: 构建并部署
      steps:
        - step: shell@agent
          name: deploy_admin
          displayName: Docker 构建部署后台
          hostGroupID: freechat-prod
          script: |
            set -euo pipefail

            IMAGE_NAME=freechat-admin
            CONTAINER_NAME=freechat-admin

            docker build -t "${IMAGE_NAME}:latest" .

            docker stop "${CONTAINER_NAME}" 2>/dev/null || true
            docker rm "${CONTAINER_NAME}" 2>/dev/null || true

            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              --network host \
              "${IMAGE_NAME}:latest"

            docker ps --filter "name=${CONTAINER_NAME}"
