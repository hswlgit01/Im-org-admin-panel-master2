# Admin panel container runs with `--network host` so 127.0.0.1 here refers to
# the host itself. That lets nginx reach chat-api-admin (listenIP=localhost,
# port 10009) without exposing it on the public interface.
server {
    listen 11002;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml application/wasm;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    default_type application/wasm;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    # dawn 2026-05-21 修复上传文件限制：后台入口允许200MB请求体。
    # Excel 导入等接口需要更大 body
    client_max_body_size 200m;

    # Shared proxy config
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # /third_admin/* and /third/* → chat-api-chat (10008, 0.0.0.0). Registered by
    # freechat extension; do NOT proxy /complete_admin through this port.
    location /third_admin/ { proxy_pass http://127.0.0.1:10008; }
    location /third/       { proxy_pass http://127.0.0.1:10008; }

    # /complete_admin/* → chat-api-admin (10009, localhost-only).
    location /complete_admin/ { proxy_pass http://127.0.0.1:10009; }

    # /api/* and /auth/* → openim-api (10002).
    location /api/  { proxy_pass http://127.0.0.1:10002/; }
    location /auth/ { proxy_pass http://127.0.0.1:10002; }

    # WebSocket → openim-msggateway (10001).
    location /ws/ {
        proxy_pass http://127.0.0.1:10001/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
