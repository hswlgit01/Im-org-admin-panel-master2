# Admin panel container runs with `--network host` so 127.0.0.1 here refers to
# the host itself. That lets nginx reach chat-api-admin (listenIP=localhost,
# port 10009) without exposing it on the public interface.
server {
    listen 11002;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml application/wasm;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    default_type application/wasm;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    # dawn 2026-05-21 修复上传文件限制：后台入口允许200MB请求体。
    # Excel 导入等接口需要更大 body
    client_max_body_size 200m;

    # Shared proxy config
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # /third_admin/* and /third/* → chat-api-chat (10008, 0.0.0.0). Registered by
    # freechat extension; do NOT proxy /complete_admin through this port.
    location /third_admin/ { proxy_pass http://127.0.0.1:10008; }
    location /third/       { proxy_pass http://127.0.0.1:10008; }

    # /complete_admin/* → chat-api-admin (10009, localhost-only).
    location /complete_admin/ { proxy_pass http://127.0.0.1:10009; }

    # /api/* and /auth/* → openim-api (10002).
    location /api/  { proxy_pass http://127.0.0.1:10002/; }
    location /auth/ { proxy_pass http://127.0.0.1:10002; }

    # dawn 2026-07-09 修复后台"新建群组/编辑资料"里点击上传头像必报错：
    # 前端 src/services/upload.ts 用 API_URL='' 直接请求 /object/part_size、
    # /object/initiate_multipart_upload、/object/complete_multipart_upload(均为 POST)。
    # 之前没有 /object/ 这条 location，请求落到下面的静态 SPA location(try_files)，
    # nginx 对静态资源的 POST 直接返回 405 Method Not Allowed → 上传永远失败。
    # 反代到 openim-api(10002)，它同时提供 /object/* 的分片上传 API 与对象下载(GET)。
    # 不带尾斜杠：保留原始 URI(/object/xxx)，与 /auth/ 一致。
    location /object/ { proxy_pass http://127.0.0.1:10002; }

    # WebSocket → openim-msggateway (10001).
    location /ws/ {
        proxy_pass http://127.0.0.1:10001/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
